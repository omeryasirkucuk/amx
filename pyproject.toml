[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amx-cli"
version = "0.16.0"
description = "Agentic Metadata Extractor — AI-powered CLI to infer and manage database metadata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Omer Yasir Kucuk"},
]
keywords = [
    "metadata",
    "database",
    "documentation",
    "llm",
    "rag",
    "data-catalog",
    "agentic",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── Core: needed by EVERY ``amx`` invocation ────────────────────────
    # Heavier feature clusters (RAG document ingest, cloud sources,
    # Batch APIs, gitpython, semantic embedding metrics) are auto-
    # installed by AMX itself the first time the user reaches the
    # relevant feature — see ``amx/utils/optional_deps.py``.
    #
    # AMX Studio (FastAPI / uvicorn / sse-starlette / multipart) and
    # the DuckDB driver pair are part of the everyone-uses-them path,
    # so they live in core: a single ``pip install amx-cli`` is
    # sufficient to open ``/studio`` or query a local DuckDB profile
    # without any second-stage download. Niche backends (Snowflake,
    # Databricks, BigQuery, …) still install lazily per-profile.
    "click>=8.1",
    "rich>=13.0",
    "prompt_toolkit>=3.0.40",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.83.7",
    "requests>=2.31",
    "keyring>=24.0",
    # ``truststore`` lets Python's ``ssl`` module consult the OS
    # trust store (Windows Cert Store / macOS Keychain / Linux
    # system bundle) through first-class OS APIs. AMX injects it at
    # startup so corporate-CA-only certificates already imported into
    # the OS for browsers / curl also work for AMX's HTTPS calls,
    # without forcing the user to set ``AMX_CA_BUNDLE`` by hand.
    "truststore>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    # Required by FastAPI's Form/File so the doc-upload drag-drop
    # endpoint accepts multipart bodies.
    "python-multipart>=0.0.7",
    "duckdb>=1.0",
    "duckdb-engine>=0.13",
    # ``croniter`` evaluates recurring schedule expressions: the
    # Catalog Freshness "Schedule" affordance accepts cron strings or
    # an interval dropdown that maps to one, and the scheduler tick
    # uses ``croniter.get_next()`` to re-arm the next fire after each
    # successful run.
    "croniter>=2.0",
]

[project.urls]
Homepage = "https://github.com/omeryasirkucuk/amx"
Documentation = "https://omeryasirkucuk.github.io/amx-docs/"
Repository = "https://github.com/omeryasirkucuk/amx"
Issues = "https://github.com/omeryasirkucuk/amx/issues"
Changelog = "https://github.com/omeryasirkucuk/amx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ── Feature bundles (preinstall to skip the auto-install prompt) ─────
# AMX auto-installs these the first time the user reaches the matching
# feature, so ``pip install amx-cli`` is enough for a normal install.
# Pre-install one of these extras when the runtime environment has no
# pip access (Docker images, air-gapped CI, locked corp envs).
rag = [
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
]
docs = [
    "chromadb>=0.5",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    "unstructured>=0.15",
    "python-magic>=0.4",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    # ``markdownify`` converts HTML email bodies to markdown in the
    # pure-Python .eml loader (amx/docs/loaders/eml_loader.py); keeps
    # the prompt fed to the LLM consistent across plain-text and HTML
    # messages.
    "markdownify>=0.11",
    # CVE-2026-41066 was disclosed against lxml<6.1.0 in 2026-05.
    # ``unstructured`` pulls lxml transitively without pinning a
    # secure floor, so we pin one here. Drop this constraint once
    # ``unstructured``'s own pin catches up.
    "lxml>=6.1.0",
]
# Documentation Pages export pipeline. Pure-Python so it installs
# cleanly on every supported OS. ``markdown-it-py`` renders the
# canonical markdown body to HTML; ``xhtml2pdf`` renders that HTML
# to a PDF byte stream. Auto-installed on demand via the optional-
# deps registry when the user first triggers a PDF export.
pages = [
    "markdown-it-py>=3",
    "xhtml2pdf>=0.2.11",
    "markdownify>=0.11",
    "openpyxl>=3.1",
]
# PDF report rendering for the Compare modal (auto-installed on
# demand via amx.utils.optional_deps when the user clicks
# "Download PDF" in Studio or runs /search compare --pdf). Kept as
# its own extra because WeasyPrint pulls Pango/Cairo bindings that
# are heavier than the rest of `studio`.
pdf = [
    "weasyprint>=60",
    "jinja2>=3.1",
]
# /lineage view-DDL parsing + diagram rendering. Pure-pip: networkx
# handles layout, matplotlib rasterises SVG/PNG/JPG, sqlglot parses
# view DDL into column lineage. No system binaries — the previous
# ``dot`` requirement is gone. AMX auto-installs this bundle on the
# first /lineage create.
lineage = [
    "sqlglot>=23",
    "networkx>=3.0",
    "matplotlib>=3.7",
]
# Reference-based and reference-free text-quality metrics for the
# /history compare flow. Lazy-installed by amx.utils.optional_deps
# the first time the user opts into Tier 0 quality analysis (CLI
# ``--quality basic|full`` or Studio "Run deeper analysis" button).
# Heavier semantic metrics live in their own extras: ``local-embeddings``
# already covers sentence-transformers (Tier 1), ``bertscore`` opts
# into BERTScore (Tier 1.5).
quality = [
    "sacrebleu>=2.4",
    "rouge-score>=0.1",
]
bertscore = [
    "bert-score>=0.3",
    # Pin transformers >= 4.57 so it accepts tokenizers >= 0.22 —
    # transformers 4.56 still capped tokenizers at < 0.22, which made
    # sentence-transformers fail to load at runtime ("tokenizers >=
    # 0.21, < 0.22 is required ... found tokenizers == 0.22.2") in any
    # long-running process that imported transformers via another
    # path (e.g. chromadb's bundled MiniLM) before sentence-transformers.
    "transformers>=4.57",
]
cloud-sources = [
    "boto3>=1.34",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "msal>=1.24",
]
batch = [
    "openai>=1.0",
    "anthropic>=0.30",
]
git-sources = [
    "gitpython>=3.1",
]
# Optional richer SQL parsing inside ``/code analyze``. When the
# package is absent, the codebase analyzer falls back to a regex
# scanner, so the feature degrades gracefully instead of failing.
code-intel = [
    "sqlglot>=24.0",
]
local-embeddings = [
    "sentence-transformers>=3.0",
    # Match the floor in the ``bertscore`` extra: sentence-transformers
    # also pulls transformers + tokenizers, and the same dependency-
    # resolver mismatch surfaces here when a previously-pinned
    # transformers stays at 4.51.x while tokenizers gets bumped to
    # 0.22.x.
    "transformers>=4.57",
]
# ── Database backend extras ───────────────────────────────────────────────
# Each backend's drivers live in their own extra so the default install
# stays lean. Pick what you use:
#   pip install amx[postgresql]      # one backend
#   pip install amx[postgresql,mysql,duckdb]  # several
#   pip install amx[all]             # every backend (~100MB+ of drivers)
postgresql = ["psycopg2-binary>=2.9"]
snowflake = [
    "snowflake-sqlalchemy>=1.6",
    "snowflake-connector-python>=3.6",
]
databricks = [
    "databricks-sqlalchemy>=1.0",
    "databricks-sql-connector>=3.0",
]
bigquery = [
    "sqlalchemy-bigquery>=1.9",
    "google-cloud-bigquery>=3.13",
]
mysql = ["pymysql>=1.1", "cryptography>=42.0"]
oracle = ["oracledb>=2.0"]
mssql = ["pyodbc>=5.0"]
redshift = ["redshift_connector>=2.1", "sqlalchemy-redshift>=0.8"]
clickhouse = [
    "clickhouse-connect>=0.7",
    "clickhouse-sqlalchemy>=0.3",
]
# Trino + Presto share the same wire protocol; the ``trino`` python
# client (with its built-in ``trino.sqlalchemy`` dialect submodule)
# covers both. Pure-Python wheels on win/mac/linux, no compiler required.
trino = [
    "trino[sqlalchemy]>=0.330",
]
# Hive (HiveServer2) — pure-Python install path. Bare ``pyhive`` ships
# the SQLAlchemy dialect submodule (``pyhive.sqlalchemy_hive``) that
# registers the ``hive://`` URL scheme. We DELIBERATELY do NOT pull
# ``pyhive[hive]`` because that extra brings in ``sasl`` (the C
# extension) which has no Windows wheels for modern Pythons and fails
# to build on macOS. Pinning ``thrift-sasl`` ≥0.4.3 + ``pure-sasl``
# instead routes SASL through pure-Python code that wheels cleanly on
# all three target OSes.
hive = [
    "pyhive>=0.7",
    "thrift>=0.16",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6",
]
all = [
    # Niche DB backend drivers (DuckDB lives in core deps; not repeated here).
    "psycopg2-binary>=2.9",
    "snowflake-sqlalchemy>=1.6",
    "snowflake-connector-python>=3.6",
    "databricks-sqlalchemy>=1.0",
    "databricks-sql-connector>=3.0",
    "sqlalchemy-bigquery>=1.9",
    "google-cloud-bigquery>=3.13",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "oracledb>=2.0",
    "pyodbc>=5.0",
    "redshift_connector>=2.1",
    "sqlalchemy-redshift>=0.8",
    "clickhouse-connect>=0.7",
    "clickhouse-sqlalchemy>=0.3",
    "trino[sqlalchemy]>=0.330",
    "pyhive>=0.7",
    "thrift>=0.16",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6",
    # Every optional feature cluster (auto-installed on demand
    # otherwise). Studio + DuckDB are core deps now and intentionally
    # NOT repeated here.
    "chromadb>=0.5",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    "unstructured>=0.15",
    "python-magic>=0.4",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "markdownify>=0.11",
    "markdown-it-py>=3",
    # ``xhtml2pdf`` lives only in the ``[pages]`` extra (not in
    # ``[all]``) because it transitively pulls ``svglib`` -> ``pycairo``,
    # which needs a native Cairo system library that is absent from
    # the GitHub Actions Linux runners. PDF export lazy-imports it at
    # call time, so the rest of the documentation-pages router works
    # without it.
    # CVE-2026-41066 floor — see comment on the same pin in the
    # ``docs`` extra above.
    "lxml>=6.1.0",
    "weasyprint>=60",
    "jinja2>=3.1",
    "sacrebleu>=2.4",
    "rouge-score>=0.1",
    "bert-score>=0.3",
    # Same transformers floor as the ``bertscore`` and
    # ``local-embeddings`` extras above — keeps pip from leaving an
    # older transformers (4.51.x, tokenizers<0.22 spec) installed
    # while bert-score / sentence-transformers pull tokenizers 0.22+
    # and the resolver flags the mismatch on every install.
    "transformers>=4.57",
    "sentence-transformers>=3.0",
    "boto3>=1.34",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "msal>=1.24",
    "openai>=1.0",
    "anthropic>=0.30",
    "gitpython>=3.1",
    "sqlglot>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
]
# Optional benchmark harness. Lives under tests/perf/ and is opt-in:
#   pip install -e ".[perf]"
#   pytest tests/perf -m perf --benchmark-only
# Never auto-installed; never imported by the runtime amx package.
# DuckDB is already a core dependency, so it is intentionally not
# repeated here.
perf = [
    "pytest-benchmark>=4.0",
    "psutil>=5.9",
]

[project.scripts]
amx = "amx.cli:run_cli"

[tool.setuptools.packages.find]
include = ["amx*"]

[tool.setuptools.package-data]
# Ship the pre-built /studio SPA bundle (index.html + hashed
# assets) inside the wheel. The directory is committed to the repo
# (vendored dist) so a developer cloning the repo + running
# ``pip install -e .`` gets a working AMX Studio without Node.
"amx.web" = ["static/**/*", "static/index.html"]
# Jinja templates used by /search compare --pdf and the Studio
# "Download PDF" button. WeasyPrint reads them at render time, so
# they have to ship inside the wheel alongside the Python code.
"amx.cli_support" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "amx.egg-info", "dataset"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # line-too-long (we have rich strings; ruff format handles wrapping)
    "B008",   # function calls in defaults (Click/Typer pattern)
    # SIM rules below are intentional codebase patterns, not antipatterns:
    "SIM105", # try/except/pass — defensive guards around best-effort I/O
    "SIM117", # nested with — kept when the inner context depends on outer setup
    "SIM102", # nested if — clearer with explanatory per-level conditions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"amx/cli*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
exclude = [
    "build/",
    "dist/",
    "amx.egg-info/",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip integration + live tests by default. They cover stale mock-LLM
# assertions and real Postgres / live API calls that the headless CI
# runner can't satisfy. Run them locally with:
#   pytest -m "integration or live"   (run only the marked ones)
#   pytest -m ""                      (run everything, ignore the filter)
addopts = "-ra --strict-markers -m 'not integration and not live and not perf'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services or coordinated mock setup",
    "live: marks tests that hit real LLM or DB endpoints",
    "perf: marks performance benchmarks (opt-in via 'pytest tests/perf -m perf')",
]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.semantic_release]
version_variables = ["amx/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "python -m pip install build && python -m build"
upload_to_pypi = false  # PyPI publish is handled by release.yml via OIDC
upload_to_release = false  # GitHub release is created by release.yml
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "chore", "ci", "build", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = ".github/semantic_release_templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ["^chore\\(release\\):", "^Merge "]
