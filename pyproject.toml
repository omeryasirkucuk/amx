[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amx"
version = "0.3.5"
description = "Agentic Metadata Extractor — AI-powered CLI to infer and manage database metadata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Omer Yasir Kucuk"},
]
keywords = [
    "metadata",
    "database",
    "documentation",
    "llm",
    "rag",
    "data-catalog",
    "agentic",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "prompt_toolkit>=3.0.40",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "chromadb>=0.5",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    "openai>=1.0",
    "anthropic>=0.30",
    "google-generativeai>=0.7",
    "litellm>=1.83.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "unstructured>=0.15",
    "python-magic>=0.4",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "gitpython>=3.1",
    "boto3>=1.34",
    "requests>=2.31",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "msal>=1.24",
    "snowflake-sqlalchemy>=1.6",
    "snowflake-connector-python>=3.6",
    "databricks-sqlalchemy>=1.0",
    "databricks-sql-connector>=3.0",
    "sqlalchemy-bigquery>=1.9",
    "google-cloud-bigquery>=3.13",
    "keyring>=24.0",
]

[project.urls]
Homepage = "https://github.com/omeryasirkucuk/amx"
Repository = "https://github.com/omeryasirkucuk/amx"
Issues = "https://github.com/omeryasirkucuk/amx/issues"
Changelog = "https://github.com/omeryasirkucuk/amx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
code-intel = [
    "sqlglot>=24.0",
]
local-embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
amx = "amx.cli:run_cli"

[tool.setuptools.packages.find]
include = ["amx*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "amx.egg-info", "dataset"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line-too-long (we have rich strings; ruff format handles wrapping)
    "B008",  # function calls in defaults (Click/Typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"amx/cli*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
exclude = [
    "build/",
    "dist/",
    "amx.egg-info/",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
    "live: marks tests that hit real LLM or DB endpoints",
]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.semantic_release]
version_variables = ["amx/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "python -m pip install build && python -m build"
upload_to_pypi = false  # PyPI publish is handled by release.yml via OIDC
upload_to_release = false  # GitHub release is created by release.yml
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "chore", "ci", "build", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = ".github/semantic_release_templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ["^chore\\(release\\):", "^Merge "]
