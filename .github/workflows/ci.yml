name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: ruff check amx tests
      - name: ruff format check
        run: ruff format --check amx tests

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mypy
      - name: mypy
        run: mypy amx
        continue-on-error: true

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,code-intel]" pytest pytest-cov
      - name: Run tests
        run: pytest -ra
        env:
          AMX_NO_NETWORK: "1"

  web-build-freshness:
    name: Web bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build SPA
        working-directory: frontend
        run: npm run build
      - name: Verify amx/web/static is up-to-date
        run: |
          # The SPA dist is committed (vendored) so end users don't
          # need Node. This step blocks PRs that change the frontend
          # without re-running the build.
          if ! git diff --quiet amx/web/static; then
            echo "::error::amx/web/static is stale. Run 'make web-build' and commit the result."
            git diff amx/web/static | head -200
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory-only for now: surfaces CVEs in dependencies without
    # blocking PRs. Drop ``continue-on-error`` once the baseline is
    # clean and the team is ready to gate merges on advisories.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          # Install the same surface the test job exercises so audit
          # sees every transitive dep AMX actually pulls in.
          python -m pip install -e ".[all,code-intel]"
      - name: Run pip-audit
        run: pip-audit --strict --progress-spinner off

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distribution
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
