# Dependabot configuration.
#
# All updates open as PRs against main; merging is manual so a human
# reviews any version bump before it lands. Commit-message prefixes
# use ``build`` / ``ci`` — both are allowed by ``commit_parser_options``
# in pyproject.toml but neither is in ``minor_tags`` or ``patch_tags``,
# so dependabot PRs do not trigger a python-semantic-release version
# bump on merge.

version: 2
updates:
  # Python runtime + dev/test/perf extras (everything in pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Major bumps need a planned migration (e.g. SQLAlchemy 2 → 3,
    # Click 8 → 9). Auto-grouping them with minor/patch bumps in a
    # single PR makes the PR un-reviewable and impossible to revert
    # surgically. Security advisories still surface independently.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns: ["*"]

  # Studio SPA dependencies under frontend/
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    # Same major-bump cap as the pip ecosystem. PR #191 was a 14-pkg
    # major-grouped bundle (React 18→19, Router 6→7, Vite 5→8, …)
    # that broke ``npm run build`` against the current SPA. Future
    # major migrations land as one-off manual PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-deps:
        patterns: ["*"]

  # GitHub Actions used in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
